<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration System</title>
</head>
<body>

    <h2>Employee Registration Form</h2>
    <form id="employeeForm">
        <div>
            <label for="empName">Employee Name:</label>
            <input type="text" id="empName" placeholder="Enter name">
        </div>
        <br>
        <div>
            <label for="empAge">Employee Age:</label>
            <input type="number" id="empAge" placeholder="Enter age">
        </div>
        <br>
        <div>
            <label for="empDept">Department:</label>
            <input type="text" id="empDept" placeholder="Enter department">
        </div>
        <br>
        <div>
            <label for="empSalary">Salary:</label>
            <input type="number" id="empSalary" step="any" placeholder="Enter salary">
        </div>
        <br>
        
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

    <br>
    <h3>Employee Records</h3>
    <table border="1" cellpadding="8" cellspacing="0" id="employeeTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>   </tbody>
    </table>

   
    <script src="assets/index.js"></script>
</body>
</html>
